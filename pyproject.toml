[project]
name = "edu-c2-051"
version = "1.0.1"
description = "Teacher Professional Development Evidence Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by CI. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# PyYAML is a runtime dependency: the PB-7 contract reads config/config.yaml.
dependencies = [
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# AgentCore 1.0.x does not publish a py.typed marker. Keep project checks
# strict where annotations exist while treating that package boundary as untyped.
disable_error_code = ["import-untyped"]
disallow_subclassing_any = false
disallow_any_generics = false
disallow_untyped_defs = false
warn_return_any = false
